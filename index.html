<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Protótipo SAJ6 – Acesso</title>
<style>
  /* Bayon Design System (@bayon/commons 6.0.12): tokens, Input, Button e mensagem de erro
     medidos nos componentes reais. Canto reto, sombra só de contorno, uma família tipográfica. */
  @font-face{font-family:"Selawik";src:url("fontes/selawksl.woff2") format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Selawik";src:url("fontes/selawk.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Selawik";src:url("fontes/selawksb.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Selawik";src:url("fontes/selawkb.woff2") format("woff2");font-weight:700;font-display:swap}
  :root{
    --themeDarker:#03508D; --themeDark:#0063B1; --themePrimary:#0072cc; --primaryClick:#005292;
    --neutralPrimary:#333333; --neutralSecondary:#4D4D4D; --neutralSecondaryAlt:#6c6c6c; --neutralTertiary:#A6A6A6;
    --defaultDark:#C5C5C5; --neutralLight:#F4F4F4; --white:#FFFFFF; --danger:#E81123; --focus:#0078D7;
    --shadow-hairline:0 0 2px rgba(77,77,77,.28);
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
    --font-sans:"Segoe UI","Selawik","Tahoma","Verdana","Arial",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--font-sans);color:var(--neutralPrimary);background:var(--neutralLight);font-size:14px;line-height:1.4;
    display:flex;flex-direction:column;min-height:100vh}
  svg{fill:currentColor}

  /* Header do produto: 48px em themeDarker */
  .topo{height:48px;flex:none;background:var(--themeDarker);color:var(--white);display:flex;align-items:center;padding:0 var(--space-4)}
  .topo .marca{font-weight:700;font-size:17px;padding-right:var(--space-4);border-right:1px solid rgba(255,255,255,.35)}
  .topo .titulo{font-weight:600;font-size:17px;padding-left:var(--space-4)}

  main{flex:1;display:grid;place-items:center;padding:var(--space-5) var(--space-4)}
  .cartao{width:100%;max-width:360px;background:var(--white);border-radius:0;box-shadow:var(--shadow-hairline);padding:var(--space-5)}
  h1{font-size:18px;font-weight:600;margin:0 0 var(--space-1)}
  .sub{color:var(--neutralSecondaryAlt);margin:0 0 var(--space-5)}

  /* Input: rótulo 14px neutralSecondaryAlt; campo 32px, borda neutralSecondaryAlt, padding 8px */
  .campo + .campo{margin-top:var(--space-4)}
  label{display:block;color:var(--neutralSecondaryAlt);margin-bottom:6px}
  input{display:block;width:100%;height:32px;padding:0 var(--space-2);font:inherit;color:var(--neutralPrimary);background:var(--white);
    border:1px solid var(--neutralSecondaryAlt);border-radius:0;outline:0}
  input::placeholder{color:var(--neutralTertiary);opacity:1}
  input:hover{border-color:var(--neutralPrimary)}
  input:focus{border-color:var(--themePrimary);box-shadow:inset 0 0 0 1px var(--themePrimary)}
  input[aria-invalid="true"]{border-color:var(--danger)}
  input[aria-invalid="true"]:focus{box-shadow:inset 0 0 0 1px var(--danger)}

  /* Mensagem de erro do Input: ícone 14px + 10px + texto 14px em danger, 4px abaixo do campo */
  .erro{display:flex;align-items:flex-start;gap:10px;color:var(--danger);margin:var(--space-1) 0 0}
  .erro svg{width:14px;height:14px;flex:none;margin-top:3px}
  .erro:has(span:empty){display:none}

  /* Button contained primary: 32px, 14px semibold, padding 16px, canto reto, sem caixa-alta */
  button{display:block;margin-top:var(--space-5);width:100%;height:32px;padding:0 var(--space-4);font:inherit;font-weight:600;
    color:var(--white);background:var(--themePrimary);border:0;border-radius:0;text-transform:none;cursor:pointer}
  button:hover{background:var(--themeDark)}
  button:active{background:var(--primaryClick)}
  button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  button[disabled]{background:var(--defaultDark);color:var(--neutralSecondary);cursor:progress}

  .rodape{color:var(--neutralSecondaryAlt);font-size:12px;margin:var(--space-3) 0 0}
  noscript{display:block;margin-top:var(--space-3);color:var(--danger)}
</style>
</head>
<body>
<header class="topo"><span class="marca">SAJ</span><span class="titulo">Protótipo</span></header>
<main>
  <form class="cartao" id="form" novalidate>
    <h1>Acesso restrito</h1>
    <p class="sub">Informe o e-mail da Softplan ou do Ministério Público e a senha do protótipo.</p>

    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="nome@softplan.com.br ou nome@mp[UF].mp.br" required aria-describedby="erro-email">
      <p class="erro"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M17 23.5h-2.1V12.8H17zm0-12.9h-2.1V8.5H17z"/><path d="M16 0a16 16 0 1 1 0 32 16 16 0 0 1 0-32m0 30a14 14 0 1 0 0-28 14 14 0 0 0 0 28"/></svg><span id="erro-email" role="alert"></span></p>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required aria-describedby="erro-senha">
      <p class="erro"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M17 23.5h-2.1V12.8H17zm0-12.9h-2.1V8.5H17z"/><path d="M16 0a16 16 0 1 1 0 32 16 16 0 0 1 0-32m0 30a14 14 0 1 0 0-28 14 14 0 0 0 0 28"/></svg><span id="erro-senha" role="alert"></span></p>
    </div>

    <button type="submit" id="entrar">Entrar no protótipo</button>
    <p class="rodape">Sem a senha, solicitar a quem compartilhou o protótipo.</p>
    <noscript>Ative o JavaScript para acessar o protótipo.</noscript>
  </form>
</main>

  const CHAVE_SESSAO = 'saj6-prototipo-acesso';
  // Softplan ou Ministério Público de qualquer UF: @mp<UF>.mp.br (ex.: mpce.mp.br).
  // O MP do Distrito Federal usa mpdft.mp.br, por isso o "dft" além do "df".
  const UFS = 'ac|al|ap|am|ba|ce|df|dft|es|go|ma|mt|ms|mg|pa|pb|pr|pe|pi|rj|rn|rs|ro|rr|sc|sp|se|to';
  const DOMINIO = new RegExp('^[^\\s@]+@(softplan\\.com\\.br|mp(' + UFS + ')\\.mp\\.br)$', 'i');

  const $ = (id) => document.getElementById(id);
  const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const paraB64 = (u8) => btoa(String.fromCharCode(...u8));

  async function chaveDaSenha(senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: deB64(PACOTE.sal), iterations: PACOTE.it, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function abrir(chave) {
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(PACOTE.iv) }, chave, deB64(PACOTE.dados));
    return new TextDecoder().decode(claro);
  }

  function mostrar(html) {
    document.open();
    document.write(html);
    document.close();
  }

  // Mantém o acesso enquanto a aba estiver aberta (recarregar não pede login de novo).
  async function tentarSessao() {
    let bruta = null;
    try { bruta = sessionStorage.getItem(CHAVE_SESSAO); } catch (_) { return; }
    if (!bruta) return;
    try {
      const chave = await crypto.subtle.importKey('raw', deB64(bruta), 'AES-GCM', false, ['decrypt']);
      mostrar(await abrir(chave));
    } catch (_) {
      try { sessionStorage.removeItem(CHAVE_SESSAO); } catch (__) {}
    }
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const senha = $('senha').value;
    $('erro-email').textContent = '';
    $('erro-senha').textContent = '';
    $('email').removeAttribute('aria-invalid');
    $('senha').removeAttribute('aria-invalid');

    if (!DOMINIO.test(email)) {
      $('erro-email').textContent = 'Informe um e-mail @softplan.com.br ou @mp[UF].mp.br.';
      $('email').setAttribute('aria-invalid', 'true');
      $('email').focus();
      return;
    }
    if (!senha) {
      $('erro-senha').textContent = 'Informe a senha.';
      $('senha').setAttribute('aria-invalid', 'true');
      $('senha').focus();
      return;
    }

    const botao = $('entrar');
    botao.disabled = true;
    botao.textContent = 'Verificando…';
    try {
      const chave = await chaveDaSenha(senha);
      const html = await abrir(chave);
      try {
        const bruta = new Uint8Array(await crypto.subtle.exportKey('raw', chave));
        sessionStorage.setItem(CHAVE_SESSAO, paraB64(bruta));
      } catch (_) {}
      mostrar(html);
    } catch (_) {
      $('erro-senha').textContent = 'Senha incorreta. Confira a senha recebida.';
      $('senha').setAttribute('aria-invalid', 'true');
      $('senha').select();
      botao.disabled = false;
      botao.textContent = 'Entrar no protótipo';
    }
  });

  if (!PACOTE || !window.crypto || !crypto.subtle) {
    $('erro-senha').textContent = 'Navegador sem suporte. Abrir o protótipo em um navegador atualizado.';
    $('entrar').disabled = true;
    return;
  }
  // Depois do load: durante o carregamento o document.open() da troca de página é ignorado.
  if (document.readyState === 'complete') tentarSessao();
  else window.addEventListener('load', tentarSessao, { once: true });
})();
</script>
